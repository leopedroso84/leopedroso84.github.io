name: Rotina Deep Schedule Audit Temp
on:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Deep audit schedule logic
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,plistlib
          sid='324233eacac44a4fa103464f0efd6a5d'
          def get(u):
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(q,timeout=30) as r:return r.read()
          m=json.loads(get('https://www.icloud.com/shortcuts/api/records/'+sid)); raw=get(m['fields']['shortcut']['value']['downloadURL']); A=plistlib.loads(raw)['WFWorkflowActions']
          def scrub(x):
            if isinstance(x,dict): return {k:scrub(v) for k,v in x.items() if 'uuid' not in k.lower() and k!='GroupingIdentifier'}
            if isinstance(x,list): return [scrub(v) for v in x]
            return x
          for lo,hi,label in [(1,20,'CYCLE'),(60,139,'SCHEDULE')]:
            print(label+'_START')
            for i in range(lo,hi+1):
              a=A[i-1]; print(label,i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
            print(label+'_END')
          PY
