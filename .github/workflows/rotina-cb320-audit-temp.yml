name: Rotina CB320 Audit Temp
on:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Compare latest Rotina
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,plistlib,difflib
          ids={'prev':'324233eacac44a4fa103464f0efd6a5d','new':'cb32010322bc4192bf7532efb1baef03'}
          def get(u):
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(q,timeout=30) as r:return r.read()
          def fetch(sid):
            m=json.loads(get('https://www.icloud.com/shortcuts/api/records/'+sid)); f=m['fields']; raw=get(f['shortcut']['value']['downloadURL']); return m,plistlib.loads(raw)
          data={}
          for k,sid in ids.items():
            m,o=fetch(sid); data[k]=(m,o)
            print('META',k,f"name={m['fields']['name']['value']}",f"signing={m['fields'].get('signingStatus',{}).get('value')}",f"actions={len(o.get('WFWorkflowActions',[]))}",f"triggers={len(o.get('WFWorkflowTriggers',[]))}")
          prev=data['prev'][1]['WFWorkflowActions']; new=data['new'][1]['WFWorkflowActions']
          def scrub(x):
            if isinstance(x,dict): return {k:scrub(v) for k,v in x.items() if 'uuid' not in k.lower() and k!='GroupingIdentifier'}
            if isinstance(x,list): return [scrub(v) for v in x]
            return x
          def canon(a): return json.dumps(scrub(a),sort_keys=True,ensure_ascii=False,default=str)
          sm=difflib.SequenceMatcher(a=[canon(x) for x in prev],b=[canon(x) for x in new],autojunk=False)
          print('DIFF_START')
          for tag,i1,i2,j1,j2 in sm.get_opcodes():
            if tag=='equal': continue
            print('DIFF',tag,'PREV',i1+1,i2,'NEW',j1+1,j2)
            for i,a in enumerate(prev[i1:i2],i1+1): print(' PREV',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
            for i,a in enumerate(new[j1:j2],j1+1): print(' NEW ',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('DIFF_END')
          def text(a): return json.dumps(scrub(a),ensure_ascii=False,default=str)
          print('SONO_OCCURRENCES',sum(('Sono' in text(a) or 'sono_' in text(a)) for a in new))
          print('SOUND_ACTIONS')
          for i,a in enumerate(new,1):
            ident=a.get('WFWorkflowActionIdentifier','')
            if 'silentmode' in ident.lower() or ident=='is.workflow.actions.setvolume': print(i,ident,repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('FOCUS_ACTIONS')
          for i,a in enumerate(new,1):
            ident=a.get('WFWorkflowActionIdentifier','')
            if 'dnd' in ident.lower() or 'focus' in ident.lower(): print(i,ident,repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          PY
