name: Rotina Schedule Audit Temp
on:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Audit schedule and states
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,plistlib
          sid='324233eacac44a4fa103464f0efd6a5d'
          def get(u):
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(q,timeout=30) as r:return r.read()
          m=json.loads(get('https://www.icloud.com/shortcuts/api/records/'+sid)); f=m['fields']; raw=get(f['shortcut']['value']['downloadURL']); o=plistlib.loads(raw)
          A=o['WFWorkflowActions']
          print('META',f['name']['value'],f.get('signingStatus',{}).get('value'),'ACTIONS',len(A))
          def scrub(x):
            if isinstance(x,dict): return {k:scrub(v) for k,v in x.items() if 'uuid' not in k.lower() and k!='GroupingIdentifier'}
            if isinstance(x,list): return [scrub(v) for v in x]
            return x
          def txt(a): return json.dumps(scrub(a),ensure_ascii=False,default=str)
          keys=['minha_semana_hoje','minha_semana_amanha','trabalhando_agora','plantao_agora','tem_feriado_hoje','tem_feriado_amanha','eh_cinzas_hoje','eh_cinzas_amanha','Escala 07:00','Escala  07:45']
          print('RELEVANT_START')
          for i,a in enumerate(A,1):
            t=txt(a)
            if any(k in t for k in keys) or ('WFDate' in t and ('2026' in t or '17/08' in t or '08/17' in t)):
              print('ACTION',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('RELEVANT_END')
          print('DATEISH_START')
          for i,a in enumerate(A,1):
            t=txt(a)
            if '17' in t and ('2026' in t or 'agosto' in t.lower() or 'aug' in t.lower()): print('DATEISH',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('DATEISH_END')
          # state actions around sound block
          for i in range(135,157):
            a=A[i-1]; print('STATE',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          PY
