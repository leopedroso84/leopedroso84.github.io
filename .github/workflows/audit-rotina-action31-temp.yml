name: Locate Rotina Condition Temp
on:
  push:
    paths:
      - '.github/workflows/audit-rotina-action31-temp.yml'
jobs:
  audit:
    runs-on: macos-26
    steps:
      - shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,plistlib
          SID='3fba15fcfa304cd29480865558502fa5'
          def g(u):return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          m=json.loads(g('https://www.icloud.com/shortcuts/api/records/'+SID));f=m['fields'];o=plistlib.loads(g(f['shortcut']['value']['downloadURL']))
          A=o['WFWorkflowActions']
          def c(x):
            if isinstance(x,dict):return {k:c(v) for k,v in x.items() if k not in ('UUID','GroupingIdentifier','OutputUUID')}
            if isinstance(x,list):return [c(v) for v in x]
            return x
          for i in range(23,38):
            a=A[i]
            print(i,a.get('WFWorkflowActionIdentifier'),json.dumps(c(a.get('WFWorkflowActionParameters',{})),ensure_ascii=False,default=str))
          PY
