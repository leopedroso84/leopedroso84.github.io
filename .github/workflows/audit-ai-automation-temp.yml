name: Audit AI Automation Temp
on:
  push:
    paths:
      - '.github/workflows/audit-ai-automation-temp.yml'
jobs:
  audit:
    runs-on: macos-26
    steps:
      - name: Compare original and AI copy
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/plistjson.swift <<'SWIFT'
          import Foundation
          func clean(_ value: Any) -> Any {
              if let d = value as? Date { return ["__date__": d.timeIntervalSinceReferenceDate] }
              if let d = value as? Data { return ["__data__": d.base64EncodedString()] }
              if let a = value as? [Any] { return a.map { clean($0) } }
              if let m = value as? [String: Any] { var out:[String:Any]=[:]; for (k,v) in m { out[k]=clean(v) }; return out }
              if let n = value as? NSNumber { return n }
              if let s = value as? NSString { return s as String }
              return String(describing:value)
          }
          let data=try Data(contentsOf:URL(fileURLWithPath:CommandLine.arguments[1]))
          var fmt=PropertyListSerialization.PropertyListFormat.binary
          let obj=try PropertyListSerialization.propertyList(from:data,options:[],format:&fmt)
          let j=try JSONSerialization.data(withJSONObject:clean(obj),options:[])
          FileHandle.standardOutput.write(j)
          SWIFT
          python3 - <<'PY'
          import urllib.request,json,plistlib,tempfile,subprocess,os,difflib
          OLD='f8a38383165c4cd1a44406a63d593391'
          NEW='d47e109d3eb74bdd970482d2a6cfac39'
          def g(u): return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          def parse(raw):
              try: return plistlib.loads(raw)
              except Exception:
                  fd,path=tempfile.mkstemp(suffix='.shortcut'); os.close(fd); open(path,'wb').write(raw)
                  try: return json.loads(subprocess.check_output(['swift','/tmp/plistjson.swift',path],timeout=90))
                  finally: os.unlink(path)
          def load(sid):
              m=json.loads(g('https://www.icloud.com/shortcuts/api/records/'+sid)); f=m['fields']
              return f['name']['value'],f.get('signingStatus',{}).get('value'),parse(g(f['shortcut']['value']['downloadURL']))
          on,osig,o=load(OLD); nn,nsig,n=load(NEW)
          print('META_OLD',on,osig,len(o.get('WFWorkflowActions',[])),len(o.get('WFWorkflowTriggers',[])))
          print('META_NEW',nn,nsig,len(n.get('WFWorkflowActions',[])),len(n.get('WFWorkflowTriggers',[])))
          DROP={'UUID','GroupingIdentifier','OutputUUID','WFTriggerUUID'}
          def clean(x):
              if isinstance(x,dict): return {k:clean(v) for k,v in x.items() if k not in DROP and 'uuid' not in k.lower()}
              if isinstance(x,list): return [clean(v) for v in x]
              return x
          def js(x): return json.dumps(clean(x),sort_keys=True,ensure_ascii=False,default=str,separators=(',',':'))
          oa=o.get('WFWorkflowActions',[]); na=n.get('WFWorkflowActions',[])
          ot=o.get('WFWorkflowTriggers',[]); nt=n.get('WFWorkflowTriggers',[])
          print('TRIGGERS_EQUAL',sorted(js(x) for x in ot)==sorted(js(x) for x in nt))
          if sorted(js(x) for x in ot)!=sorted(js(x) for x in nt):
              print('OLD_TRIGGERS'); [print(js(x)) for x in ot]
              print('NEW_TRIGGERS'); [print(js(x)) for x in nt]
          print('=== ACTION DIFF ===')
          sa=[js(a) for a in oa]; sb=[js(a) for a in na]
          sm=difflib.SequenceMatcher(a=sa,b=sb,autojunk=False)
          for tag,i1,i2,j1,j2 in sm.get_opcodes():
              if tag!='equal':
                  print('OP',tag,'OLD',i1,i2,'NEW',j1,j2)
                  for i in range(i1,i2): print(' OLD',i,oa[i].get('WFWorkflowActionIdentifier'),js(oa[i].get('WFWorkflowActionParameters',{})))
                  for j in range(j1,j2): print(' NEW',j,na[j].get('WFWorkflowActionIdentifier'),js(na[j].get('WFWorkflowActionParameters',{})))
          print('=== acordar_adiado HITS ===')
          hits=[]
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items(): walk(v,path+'/'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+'/'+str(i))
              elif isinstance(x,str) and 'acordar_adiado' in x.lower(): hits.append((path,x))
          walk(n)
          print('HIT_COUNT',len(hits))
          for h in hits: print(h)
          print('=== NEW ACTIONS AROUND HITS / ALL STORAGE+MENU+STOP ===')
          for i,a in enumerate(na):
              ident=a.get('WFWorkflowActionIdentifier','')
              p=js(a.get('WFWorkflowActionParameters',{}))
              if 'storedcontent' in ident.lower() or 'menu' in ident.lower() or 'stop' in ident.lower() or 'acordar_adiado' in p.lower() or 'descanso_noturno' in p.lower():
                  print('A',i,ident,p)
          PY