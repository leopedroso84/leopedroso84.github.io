name: Shortcut Rotina Inspect Temp
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Inspect Automação Alarme triggers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/PlistToJSON.swift <<'SWIFT'
          import Foundation
          func sanitize(_ value: Any) -> Any {
              if let d = value as? [String: Any] { var o:[String:Any]=[:]; for (k,v) in d { o[k]=sanitize(v) }; return o }
              if let a = value as? [Any] { return a.map { sanitize($0) } }
              if let date = value as? Date { return ["__date_reference_seconds": date.timeIntervalSinceReferenceDate] }
              if let data = value as? Data { return ["__data_base64": data.base64EncodedString()] }
              if value is NSNull || value is String || value is NSNumber { return value }
              return String(describing:value)
          }
          let args=CommandLine.arguments
          let data=try Data(contentsOf:URL(fileURLWithPath:args[1]))
          var format=PropertyListSerialization.PropertyListFormat.binary
          let obj=try PropertyListSerialization.propertyList(from:data,options:[],format:&format)
          let clean=sanitize(obj)
          let json=try JSONSerialization.data(withJSONObject:clean,options:[.sortedKeys])
          try json.write(to:URL(fileURLWithPath:args[2]))
          SWIFT
          python3 - <<'PY'
          import json, urllib.request, subprocess
          sid='53c343865a5b491fa70c1e34641da3ac'
          api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
          req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: meta=json.load(r)
          v=meta['fields']['shortcut']['value']
          req=urllib.request.Request(v['downloadURL'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
          open('/tmp/alarme.bplist','wb').write(raw)
          subprocess.run(['swift','/tmp/PlistToJSON.swift','/tmp/alarme.bplist','/tmp/alarme.json'],check=True)
          obj=json.load(open('/tmp/alarme.json',encoding='utf-8'))
          print('NAME',meta['fields']['name']['value'])
          print('SIGNING',meta['fields']['signingStatus']['value'])
          print('TRIGGERS',len(obj.get('WFWorkflowTriggers',[])),'ACTIONS',len(obj.get('WFWorkflowActions',[])))
          for i,t in enumerate(obj.get('WFWorkflowTriggers',[]),1):
              print(f'TRIGGER[{i}]',json.dumps(t,ensure_ascii=False,sort_keys=True))
          for i,a in enumerate(obj.get('WFWorkflowActions',[]),1):
              print(f'ACTION[{i}]',a.get('WFWorkflowActionIdentifier',''),json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,sort_keys=True))
          PY
