name: Shortcut Compare Temp

on:
  push:
    branches:
      - main

jobs:
  compare:
    runs-on: macos-latest
    steps:
      - name: Compare shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, plistlib, hashlib, copy
          OLD='f24ba67795624fdb88d11932b1c95840'
          NEW='40969add165140e2a4cc05e2eb0ede8c'

          def load_shortcut(sid):
              api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
              req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  meta=json.load(r)
              fields=meta['fields']
              v=fields['shortcut']['value']
              req=urllib.request.Request(v['downloadURL'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              obj=plistlib.loads(raw)
              return meta, raw, obj

          ometa, oraw, old = load_shortcut(OLD)
          nmeta, nraw, new = load_shortcut(NEW)

          def field(meta,key):
              x=meta.get('fields',{}).get(key,{})
              return x.get('value') if isinstance(x,dict) else None

          print('OLD_NAME',repr(field(ometa,'name')))
          print('NEW_NAME',repr(field(nmeta,'name')))
          print('OLD_SIGNING',repr(field(ometa,'signingStatus')))
          print('NEW_SIGNING',repr(field(nmeta,'signingStatus')))
          print('OLD_SHA256',hashlib.sha256(oraw).hexdigest())
          print('NEW_SHA256',hashlib.sha256(nraw).hexdigest())
          print('OLD_TRIGGERS',len(old.get('WFWorkflowTriggers',[])))
          print('NEW_TRIGGERS',len(new.get('WFWorkflowTriggers',[])))
          print('OLD_ACTIONS',len(old.get('WFWorkflowActions',[])))
          print('NEW_ACTIONS',len(new.get('WFWorkflowActions',[])))

          # Exact trigger comparison
          print('TRIGGERS_IDENTICAL', old.get('WFWorkflowTriggers',[]) == new.get('WFWorkflowTriggers',[]))
          if old.get('WFWorkflowTriggers',[]) != new.get('WFWorkflowTriggers',[]):
              print('OLD_TRIGGERS_JSON',json.dumps(old.get('WFWorkflowTriggers',[]),ensure_ascii=False,sort_keys=True,default=str))
              print('NEW_TRIGGERS_JSON',json.dumps(new.get('WFWorkflowTriggers',[]),ensure_ascii=False,sort_keys=True,default=str))

          oa=old.get('WFWorkflowActions',[])
          na=new.get('WFWorkflowActions',[])
          print('=== ACTION DIFFS ===')
          maxn=max(len(oa),len(na))
          diffs=[]
          for i in range(maxn):
              x=oa[i] if i<len(oa) else None
              y=na[i] if i<len(na) else None
              if x!=y:
                  diffs.append(i+1)
                  print('DIFF_ACTION_INDEX',i+1)
                  print('OLD',json.dumps(x,ensure_ascii=False,sort_keys=True,default=str))
                  print('NEW',json.dumps(y,ensure_ascii=False,sort_keys=True,default=str))
          print('DIFF_ACTION_COUNT',len(diffs))
          print('DIFF_ACTION_INDEXES',diffs)

          def delays(obj):
              out=[]
              for i,a in enumerate(obj.get('WFWorkflowActions',[]),1):
                  if isinstance(a,dict) and a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.delay':
                      out.append((i,a.get('WFWorkflowActionParameters',{}).get('WFDelayTime')))
              return out
          print('OLD_DELAYS',delays(old))
          print('NEW_DELAYS',delays(new))

          # Compare whole plist after normalizing only delay values 2 -> 7 in OLD
          norm=copy.deepcopy(old)
          for a in norm.get('WFWorkflowActions',[]):
              if isinstance(a,dict) and a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.delay':
                  p=a.get('WFWorkflowActionParameters',{})
                  if p.get('WFDelayTime')==2.0:
                      p['WFDelayTime']=7.0
          print('WHOLE_PLIST_MATCHES_AFTER_DELAY_NORMALIZATION', norm == new)

          # Safety/plan references summary on NEW
          plans=[]
          for i,a in enumerate(na,1):
              if not isinstance(a,dict): continue
              ident=a.get('WFWorkflowActionIdentifier','')
              p=a.get('WFWorkflowActionParameters',{})
              if ident in ('com.apple.ShortcutsActions.ToggleCellularPlanAction','com.apple.ShortcutsActions.SetDefaultCellularPlanAction'):
                  plan=p.get('plan',{})
                  title=plan.get('title',{}).get('key') if isinstance(plan,dict) else None
                  plans.append((i,ident,title,p.get('state'),p.get('type')))
          print('NEW_PLAN_ACTIONS',plans)
          print('NEW_UNIQUE_PLANS',sorted({x[2] for x in plans if x[2]}))
          print('=== END ===')
          PY
