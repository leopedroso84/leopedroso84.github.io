name: Shortcut Compare Temp

on:
  push:
    branches:
      - main

jobs:
  compare:
    runs-on: macos-latest
    steps:
      - name: Compare shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, plistlib, hashlib, copy
          BASE='f24ba67795624fdb88d11932b1c95840'
          NEW='d99435c5b2f5491781ddf6f745215a29'

          def load_shortcut(sid):
              api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
              req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  meta=json.load(r)
              v=meta['fields']['shortcut']['value']
              req=urllib.request.Request(v['downloadURL'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              return meta, raw, plistlib.loads(raw)

          bmeta,braw,base=load_shortcut(BASE)
          nmeta,nraw,new=load_shortcut(NEW)
          print('BASE_NAME',repr(bmeta['fields']['name']['value']))
          print('NEW_NAME',repr(nmeta['fields']['name']['value']))
          print('BASE_SIGNING',repr(bmeta['fields']['signingStatus']['value']))
          print('NEW_SIGNING',repr(nmeta['fields']['signingStatus']['value']))
          print('BASE_SHA256',hashlib.sha256(braw).hexdigest())
          print('NEW_SHA256',hashlib.sha256(nraw).hexdigest())
          print('BASE_TRIGGERS',len(base.get('WFWorkflowTriggers',[])))
          print('NEW_TRIGGERS',len(new.get('WFWorkflowTriggers',[])))
          print('BASE_ACTIONS',len(base.get('WFWorkflowActions',[])))
          print('NEW_ACTIONS',len(new.get('WFWorkflowActions',[])))
          print('TRIGGERS_EXACTLY_IDENTICAL',base.get('WFWorkflowTriggers',[])==new.get('WFWorkflowTriggers',[]))

          norm=copy.deepcopy(base)
          changed=[]
          for i,a in enumerate(norm.get('WFWorkflowActions',[]),1):
              if isinstance(a,dict) and a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.delay':
                  p=a.get('WFWorkflowActionParameters',{})
                  if p.get('WFDelayTime')==2.0:
                      p['WFDelayTime']=7.0
                      changed.append(i)
          print('NORMALIZED_DELAY_INDEXES',changed)
          print('WHOLE_PLIST_EXACT_MATCH_AFTER_ONLY_2_TO_7',norm==new)
          if norm!=new:
              oa=norm.get('WFWorkflowActions',[]); na=new.get('WFWorkflowActions',[])
              diffs=[]
              for i in range(max(len(oa),len(na))):
                  x=oa[i] if i<len(oa) else None
                  y=na[i] if i<len(na) else None
                  if x!=y:
                      diffs.append(i+1)
                      print('REMAINING_DIFF_ACTION',i+1)
                      print('BASE_NORM',json.dumps(x,ensure_ascii=False,sort_keys=True,default=str))
                      print('NEW',json.dumps(y,ensure_ascii=False,sort_keys=True,default=str))
              print('REMAINING_DIFF_COUNT',len(diffs))
          print('=== END ===')
          PY
