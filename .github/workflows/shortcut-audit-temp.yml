name: Shortcut Audit Temp

on:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Inspect shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, plistlib, hashlib
          sid='d8ec4431b2974fc190f17311bce2d898'
          api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
          with urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
              meta=json.load(r)
          fields=meta['fields']
          print('NAME',repr(fields.get('name',{}).get('value')))
          print('SIGNING_STATUS',repr(fields.get('signingStatus',{}).get('value')))
          v=fields['shortcut']['value']
          print('SHORTCUT_SIZE',v.get('size'))
          print('SHORTCUT_CHECKSUM',v.get('fileChecksum'))
          with urllib.request.urlopen(urllib.request.Request(v['downloadURL'],headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
              raw=r.read()
          print('SHA256',hashlib.sha256(raw).hexdigest())
          obj=plistlib.loads(raw)
          print('TRIGGER_COUNT',len(obj.get('WFWorkflowTriggers',[])))
          print('ACTION_COUNT',len(obj.get('WFWorkflowActions',[])))
          print('=== TRIGGERS BEGIN ===')
          for i,t in enumerate(obj.get('WFWorkflowTriggers',[]),1):
              print(f'[{i:02d}]',json.dumps(t,ensure_ascii=False,sort_keys=True,default=str))
          print('=== TRIGGERS END ===')
          print('=== ACTIONS BEGIN ===')
          for i,a in enumerate(obj.get('WFWorkflowActions',[]),1):
              ident=a.get('WFWorkflowActionIdentifier','') if isinstance(a,dict) else ''
              params=a.get('WFWorkflowActionParameters',{}) if isinstance(a,dict) else {}
              print(f'[{i:02d}] {ident}')
              print(json.dumps(params,ensure_ascii=False,sort_keys=True,default=str))
          print('=== ACTIONS END ===')
          danger_terms=['http://','https://','webhook','ssh','script','shell','runshortcut','clipboard','message','mail','openurl','contentssofurl','download']
          hits=[]
          def walk(x,path='root'):
              if isinstance(x,dict):
                  for k,v in x.items(): walk(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for j,v in enumerate(x): walk(v,path+f'[{j}]')
              elif isinstance(x,str):
                  low=x.lower()
                  if any(t in low for t in danger_terms): hits.append((path,x))
          walk(obj)
          print('=== DANGER HITS ===')
          for p,vv in hits: print(p,'=>',vv)
          print('=== END ===')
          PY
