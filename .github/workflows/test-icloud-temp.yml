name: Test iCloud Temp
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,plistlib,difflib
          ids={'base':'b6a37d5a0db740d5b63f4c39da154798','new':'6725abf66e3b4de89cc8dfab7b340791'}
          def get(u):
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            return urllib.request.urlopen(q,timeout=40).read()
          def load(i):
            m=json.loads(get('https://www.icloud.com/shortcuts/api/records/'+i)); f=m['fields']; raw=get(f['shortcut']['value']['downloadURL']); o=plistlib.loads(raw)
            return f['name']['value'],f.get('signingStatus',{}).get('value'),o
          def clean(x):
            if isinstance(x,dict): return {k:clean(v) for k,v in x.items() if 'uuid' not in k.lower() and k!='GroupingIdentifier'}
            if isinstance(x,list): return [clean(v) for v in x]
            if isinstance(x,bytes): return x.hex()
            return x
          def js(x): return json.dumps(clean(x),sort_keys=True,ensure_ascii=False,default=str,separators=(',',':'))
          def brief(a):
            p=a.get('WFWorkflowActionParameters',{}); vals=[]
            def w(x):
              if isinstance(x,str) and x not in vals: vals.append(x)
              elif isinstance(x,dict):
                for v in x.values(): w(v)
              elif isinstance(x,list):
                for v in x: w(v)
            w(p)
            return {'id':a.get('WFWorkflowActionIdentifier'),'vals':vals[:15],'params':clean(p)}
          bn,bs,b=load(ids['base']); nn,ns,n=load(ids['new'])
          ba=b.get('WFWorkflowActions',[]); na=n.get('WFWorkflowActions',[])
          print('META BASE',bn,bs,len(ba),len(b.get('WFWorkflowTriggers',[])))
          print('META NEW',nn,ns,len(na),len(n.get('WFWorkflowTriggers',[])))
          for k in sorted(set(b)|set(n)):
            if k in ('WFWorkflowActions','WFWorkflowTriggers'): continue
            if js(b.get(k))!=js(n.get(k)): print('TOP_CHANGED',k,'BASE',js(b.get(k))[:4000],'NEW',js(n.get(k))[:4000])
          x=[js(a) for a in ba]; y=[js(a) for a in na]
          for tag,i1,i2,j1,j2 in difflib.SequenceMatcher(a=x,b=y,autojunk=False).get_opcodes():
            if tag!='equal':
              print('DIFF',tag,'BASE',i1,i2,'NEW',j1,j2)
              for i in range(i1,i2): print('BASE_ACT',i,json.dumps(brief(ba[i]),ensure_ascii=False,default=str)[:7000])
              for j in range(j1,j2): print('NEW_ACT',j,json.dumps(brief(na[j]),ensure_ascii=False,default=str)[:7000])
          for lab,o,aa in [('BASE',b,ba),('NEW',n,na)]:
            s=js(o).lower(); print(lab,'descanso_noturno_count',s.count('descanso_noturno'),'sono_count',s.count('sono'))
            print('---',lab,'RELEVANT---')
            for i,a in enumerate(aa):
              t=js(a).lower()
              if any(z in t for z in ['descanso_noturno','setsilentmodeaction','stored','store','storage','descanso','volume']):
                print(lab,i,json.dumps(brief(a),ensure_ascii=False,default=str)[:5000])
          PY
