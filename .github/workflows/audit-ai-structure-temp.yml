name: Audit AI Structure Temp
on:
  push:
    paths:
      - '.github/workflows/audit-ai-structure-temp.yml'
jobs:
  audit:
    runs-on: macos-26
    steps:
      - name: Inspect control flow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/plistjson.swift <<'SWIFT'
          import Foundation
          func clean(_ value: Any) -> Any {
              if let d = value as? Date { return ["__date__": d.timeIntervalSinceReferenceDate] }
              if let d = value as? Data { return ["__data__": d.base64EncodedString()] }
              if let a = value as? [Any] { return a.map { clean($0) } }
              if let m = value as? [String: Any] { var out:[String:Any]=[:]; for (k,v) in m { out[k]=clean(v) }; return out }
              if let n = value as? NSNumber { return n }
              if let s = value as? NSString { return s as String }
              return String(describing:value)
          }
          let data=try Data(contentsOf:URL(fileURLWithPath:CommandLine.arguments[1]))
          var fmt=PropertyListSerialization.PropertyListFormat.binary
          let obj=try PropertyListSerialization.propertyList(from:data,options:[],format:&fmt)
          let j=try JSONSerialization.data(withJSONObject:clean(obj),options:[])
          FileHandle.standardOutput.write(j)
          SWIFT
          python3 - <<'PY'
          import urllib.request,json,plistlib,tempfile,subprocess,os
          SID='d47e109d3eb74bdd970482d2a6cfac39'
          def g(u): return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          m=json.loads(g('https://www.icloud.com/shortcuts/api/records/'+SID)); f=m['fields']; raw=g(f['shortcut']['value']['downloadURL'])
          try:o=plistlib.loads(raw)
          except Exception:
            fd,path=tempfile.mkstemp();os.close(fd);open(path,'wb').write(raw)
            try:o=json.loads(subprocess.check_output(['swift','/tmp/plistjson.swift',path]))
            finally:os.unlink(path)
          A=o.get('WFWorkflowActions',[])
          print('META',f['name']['value'],f.get('signingStatus',{}).get('value'),len(A),len(o.get('WFWorkflowTriggers',[])))
          print('=== ACTIONS ===')
          for i,a in enumerate(A):
            p=a.get('WFWorkflowActionParameters',{}); ident=a.get('WFWorkflowActionIdentifier','')
            gid=p.get('GroupingIdentifier'); mode=p.get('WFControlFlowMode')
            # compact semantic params
            keep={k:v for k,v in p.items() if k not in ('UUID','GroupingIdentifier')}
            print(i,'ID=',ident,'MODE=',mode,'GID=',gid,'PARAM=',json.dumps(keep,ensure_ascii=False,default=str)[:2500])
          print('=== TRIGGERS ===')
          for i,t in enumerate(o.get('WFWorkflowTriggers',[])):
            print(i,json.dumps(t,ensure_ascii=False,default=str))
          PY