name: Audit Auto Detail Temp
on: [push]
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,plistlib
          ids=['f8a38383165c4cd1a44406a63d593391','ce76a90d14824325a8cc2f5aa7aad5ef']
          def g(u): return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          for sid in ids:
            m=json.loads(g('https://www.icloud.com/shortcuts/api/records/'+sid)); f=m['fields']; o=plistlib.loads(g(f['shortcut']['value']['downloadURL']))
            print('SHORTCUT',f['name']['value'],f.get('signingStatus',{}).get('value'),len(o.get('WFWorkflowActions',[])),len(o.get('WFWorkflowTriggers',[])))
            if f['name']['value']=='Automação Rotina':
              for i,a in enumerate(o.get('WFWorkflowActions',[])):
                print('A',i,a.get('WFWorkflowActionIdentifier'),json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str)[:5000])
              for i,t in enumerate(o.get('WFWorkflowTriggers',[])):
                print('T',i,json.dumps(t,ensure_ascii=False,default=str)[:5000])
            else:
              for i in range(188,len(o.get('WFWorkflowActions',[]))):
                a=o['WFWorkflowActions'][i]
                print('R',i,a.get('WFWorkflowActionIdentifier'),json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str)[:5000])
          PY
