name: Audit 3 Shortcuts Temp
on: [push]
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - shell: bash
        run: |
          cat > /tmp/plistjson.swift <<'SWIFT'
          import Foundation
          func clean(_ value: Any) -> Any {
              if let d = value as? Date { return ["__date__": d.timeIntervalSinceReferenceDate] }
              if let d = value as? Data { return ["__data__": d.base64EncodedString()] }
              if let a = value as? [Any] { return a.map { clean($0) } }
              if let m = value as? [String: Any] { var out:[String:Any]=[:]; for (k,v) in m { out[k]=clean(v) }; return out }
              if let n = value as? NSNumber { return n }
              if let s = value as? NSString { return s as String }
              return String(describing:value)
          }
          let data=try Data(contentsOf:URL(fileURLWithPath:CommandLine.arguments[1]))
          var fmt=PropertyListSerialization.PropertyListFormat.binary
          let obj=try PropertyListSerialization.propertyList(from:data,options:[],format:&fmt)
          let j=try JSONSerialization.data(withJSONObject:clean(obj),options:[])
          FileHandle.standardOutput.write(j)
          SWIFT
          python3 - <<'PY'
          import urllib.request,json,plistlib,tempfile,subprocess,os
          NEW='f8a38383165c4cd1a44406a63d593391'; OLD='050b30849fb74a498890e38fdaca312a'
          def g(u):return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          def p(raw):
              try:return plistlib.loads(raw)
              except Exception:
                  fd,path=tempfile.mkstemp(suffix='.shortcut');os.close(fd);open(path,'wb').write(raw)
                  try:return json.loads(subprocess.check_output(['swift','/tmp/plistjson.swift',path],timeout=90))
                  finally:os.unlink(path)
          def load(s):
              m=json.loads(g('https://www.icloud.com/shortcuts/api/records/'+s));f=m['fields'];o=p(g(f['shortcut']['value']['downloadURL']))
              return f['name']['value'],f.get('signingStatus',{}).get('value'),o
          def clean(x):
              if isinstance(x,dict):return {k:clean(v) for k,v in x.items() if 'uuid' not in k.lower()}
              if isinstance(x,list):return [clean(v) for v in x]
              if isinstance(x,bytes):return x.hex()
              return x
          def js(x):return json.dumps(clean(x),sort_keys=True,ensure_ascii=False,default=str,separators=(',',':'))
          nn,ns,n=load(NEW);on,osig,o=load(OLD)
          print('NEW_META',nn,ns,len(n.get('WFWorkflowActions',[])),len(n.get('WFWorkflowTriggers',[])))
          print('OLD_META',on,osig,len(o.get('WFWorkflowActions',[])),len(o.get('WFWorkflowTriggers',[])))
          print('=== NEW ACTIONS ===')
          for i,a in enumerate(n.get('WFWorkflowActions',[])):
              print('A',i,a.get('WFWorkflowActionIdentifier'),json.dumps(clean(a.get('WFWorkflowActionParameters',{})),ensure_ascii=False,default=str)[:8000])
          print('=== NEW TRIGGERS ===')
          for i,t in enumerate(n.get('WFWorkflowTriggers',[])):print('T',i,js(t))
          print('=== OLD ACTIONS ===')
          for i,a in enumerate(o.get('WFWorkflowActions',[])):print('OA',i,a.get('WFWorkflowActionIdentifier'),json.dumps(clean(a.get('WFWorkflowActionParameters',{})),ensure_ascii=False,default=str)[:3000])
          print('=== OLD TRIGGERS ===')
          for i,t in enumerate(o.get('WFWorkflowTriggers',[])):print('OT',i,js(t))
          PY
