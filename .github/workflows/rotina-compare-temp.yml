name: Rotina Compare Temp
on:
  push:
    branches: [main]
jobs:
  compare:
    runs-on: macos-latest
    steps:
      - name: Compare shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, subprocess
          def load(sid,p):
              req=urllib.request.Request('https://www.icloud.com/shortcuts/api/records/'+sid,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: m=json.load(r)
              v=m['fields']['shortcut']['value']
              req=urllib.request.Request(v['downloadURL'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
              bp=f'/tmp/{p}.plist'; js=f'/tmp/{p}.json'
              open(bp,'wb').write(raw)
              subprocess.run(['/usr/bin/plutil','-convert','json','-o',js,bp],check=True)
              return m,json.load(open(js))
          om,o=load('1f1656fb583d4363a68b0adf518ca287','old')
          nm,n=load('6ee827d4b16e4db090eb956d903e1862','new')
          oa=o.get('WFWorkflowActions',[]); na=n.get('WFWorkflowActions',[])
          def scrub(x):
              if isinstance(x,dict):
                  return {k:scrub(v) for k,v in x.items() if 'uuid' not in k.lower() and k!='GroupingIdentifier'}
              if isinstance(x,list): return [scrub(v) for v in x]
              return x
          so=[scrub(x) for x in oa]; sn=[scrub(x) for x in na]
          print('OLD_NAME',om['fields']['name']['value'])
          print('NEW_NAME',nm['fields']['name']['value'])
          print('OLD_SIGNING',om['fields']['signingStatus']['value'])
          print('NEW_SIGNING',nm['fields']['signingStatus']['value'])
          print('OLD_ACTIONS',len(oa),'NEW_ACTIONS',len(na),'ADDED',len(na)-len(oa))
          print('OLD_TRIGGERS',len(o.get('WFWorkflowTriggers',[])),'NEW_TRIGGERS',len(n.get('WFWorkflowTriggers',[])))
          same = len(sn)>=len(so) and sn[:len(so)]==so
          print('PREFIX_IDENTICAL',same)
          if not same:
              d=[i+1 for i in range(min(len(so),len(sn))) if so[i]!=sn[i]]
              print('CHANGED_COUNT',len(d))
              print('CHANGED_FIRST',d[:30])
          print('TAIL_COUNT',max(0,len(na)-len(oa)))
          for i,a in enumerate(na[len(oa):],len(oa)+1):
              print(f'TAIL[{i}]',a.get('WFWorkflowActionIdentifier',''),json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,sort_keys=True))
          PY
