name: Shortcut Final Validate Temp
on:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .shortcut_latest_temp.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rotina-final-2026-09-02
          path: out/**
          retention-days: 7
