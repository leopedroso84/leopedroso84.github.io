name: Rotina Manual Audit Temp
on:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Audit current Rotina against pre-edit version
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,plistlib,difflib
          ids={'base':'1f1656fb583d4363a68b0adf518ca287','pre':'994ba242ad604eedb136dc89355b9af8','new':'324233eacac44a4fa103464f0efd6a5d'}
          def get(u):
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(q,timeout=30) as r:return r.read()
          def fetch(sid):
            m=json.loads(get('https://www.icloud.com/shortcuts/api/records/'+sid)); f=m['fields']; raw=get(f['shortcut']['value']['downloadURL']); return m,plistlib.loads(raw)
          data={}
          for k,sid in ids.items():
            m,o=fetch(sid); data[k]=(m,o)
            print('META',k,m['fields']['name']['value'],m['fields'].get('signingStatus',{}).get('value'),'ACTIONS',len(o.get('WFWorkflowActions',[])),'TRIGGERS',len(o.get('WFWorkflowTriggers',[])))
          pre=data['pre'][1]['WFWorkflowActions']; new=data['new'][1]['WFWorkflowActions']
          def scrub(x):
            if isinstance(x,dict):
              return {k:scrub(v) for k,v in x.items() if 'uuid' not in k.lower() and k!='GroupingIdentifier'}
            if isinstance(x,list): return [scrub(v) for v in x]
            return x
          def canon(a): return json.dumps(scrub(a),sort_keys=True,ensure_ascii=False,default=str)
          sm=difflib.SequenceMatcher(a=[canon(x) for x in pre],b=[canon(x) for x in new],autojunk=False)
          print('DIFF_BLOCKS_START')
          for tag,i1,i2,j1,j2 in sm.get_opcodes():
            if tag=='equal': continue
            print('DIFF',tag,'PRE',i1+1,i2,'NEW',j1+1,j2)
            for i,a in enumerate(pre[i1:i2],i1+1): print(' PRE',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
            for i,a in enumerate(new[j1:j2],j1+1): print(' NEW',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('DIFF_BLOCKS_END')
          def text(a): return json.dumps(scrub(a),ensure_ascii=False,default=str)
          print('SONO_OCCURRENCES',sum(('Sono' in text(a) or 'sono_' in text(a)) for a in new))
          for i,a in enumerate(new,1):
            ident=a.get('WFWorkflowActionIdentifier',''); t=text(a)
            if ('Sono' in t or 'sono_' in t): print('SONO_REF',i,ident,repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('FOCUS_ACTIONS_START')
          for i,a in enumerate(new,1):
            ident=a.get('WFWorkflowActionIdentifier','')
            if 'dnd' in ident.lower() or 'focus' in ident.lower(): print('FOCUS',i,ident,repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('FOCUS_ACTIONS_END')
          print('SOUND_ACTIONS_START')
          for i,a in enumerate(new,1):
            ident=a.get('WFWorkflowActionIdentifier','')
            if 'silentmode' in ident.lower() or ident=='is.workflow.actions.setvolume': print('SOUND',i,ident,repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('SOUND_ACTIONS_END')
          print('ALARMS_START')
          for i,a in enumerate(new,1):
            ident=a.get('WFWorkflowActionIdentifier',''); t=text(a)
            if 'alarm' in ident.lower() or 'Escala 07:00' in t or 'Escala 07:45' in t: print('ALARM',i,ident,repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('ALARMS_END')
          print('FINAL20_START')
          for i,a in enumerate(new[-20:],len(new)-19): print('TAIL',i,a.get('WFWorkflowActionIdentifier',''),repr(scrub(a.get('WFWorkflowActionParameters',{}))))
          print('FINAL20_END')
          PY
