name: Audit 3 Shortcuts Final Temp
on:
  push:
    paths:
      - '.github/workflows/audit-3-shortcuts-final-temp.yml'
jobs:
  audit:
    runs-on: macos-26
    steps:
      - name: Download and inspect shortcuts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/download.py <<'PY'
          import json, urllib.request, sys
          sid,out=sys.argv[1],sys.argv[2]
          def g(u): return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          m=json.loads(g('https://www.icloud.com/shortcuts/api/records/'+sid))
          f=m['fields']
          print('META',sid,'NAME=',f['name']['value'],'SIGN=',f.get('signingStatus',{}).get('value'))
          open(out,'wb').write(g(f['shortcut']['value']['downloadURL']))
          PY
          python3 /tmp/download.py f8a38383165c4cd1a44406a63d593391 /tmp/auto.raw
          python3 /tmp/download.py ce76a90d14824325a8cc2f5aa7aad5ef /tmp/rotina.raw
          python3 /tmp/download.py 8530a6183ba8476da69d144e474c245f /tmp/rede.raw
          python3 /tmp/download.py 324233eacac44a4fa103464f0efd6a5d /tmp/rotina_prev.raw
          python3 /tmp/download.py 37ebea5d0a1f42fc803f0440203fdcd1 /tmp/rede_prev.raw
          echo '=== SHA256 ==='
          shasum -a 256 /tmp/auto.raw /tmp/rotina.raw /tmp/rede.raw /tmp/rotina_prev.raw /tmp/rede_prev.raw
          echo '=== COUNTS ==='
          for f in auto rotina rede rotina_prev rede_prev; do
            echo "--- $f ---"
            /usr/libexec/PlistBuddy -c 'Print :WFWorkflowActions' /tmp/$f.raw 2>/dev/null | grep -c '^    Dict {' || true
            /usr/libexec/PlistBuddy -c 'Print :WFWorkflowTriggers' /tmp/$f.raw 2>/dev/null | grep -c '^    Dict {' || true
          done
          echo '=== AUTO FULL PLIST ==='
          plutil -p /tmp/auto.raw
          echo '=== ROTINA RELEVANT STRINGS ==='
          strings -a /tmp/rotina.raw | egrep -i 'descanso|sono|silent|volume|plantao|trabalhando|alarme|fim_almoco|noturno|carreg|acord' || true
          echo '=== ROTINA TAIL PLIST ==='
          plutil -p /tmp/rotina.raw | tail -n 900
          echo '=== ROTINA PREV TAIL PLIST ==='
          plutil -p /tmp/rotina_prev.raw | tail -n 900
          echo '=== REDE IDENTICAL? ==='
          if cmp -s /tmp/rede.raw /tmp/rede_prev.raw; then echo 'RAW_IDENTICAL=YES'; else echo 'RAW_IDENTICAL=NO'; fi
