name: Final Audit Rotina Pair Temp
on:
  push:
    paths:
      - '.github/workflows/audit-final-rotina-pair-temp.yml'
jobs:
  audit:
    runs-on: macos-26
    steps:
      - name: Audit current Rotina and Automação Rotina
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/plistjson.swift <<'SWIFT'
          import Foundation
          func clean(_ value: Any) -> Any {
              if let d = value as? Date { return ["__date__": d.timeIntervalSinceReferenceDate] }
              if let d = value as? Data { return ["__data__": d.base64EncodedString()] }
              if let a = value as? [Any] { return a.map { clean($0) } }
              if let m = value as? [String: Any] { var out:[String:Any]=[:]; for (k,v) in m { out[k]=clean(v) }; return out }
              if let n = value as? NSNumber { return n }
              if let s = value as? NSString { return s as String }
              return String(describing:value)
          }
          let data=try Data(contentsOf:URL(fileURLWithPath:CommandLine.arguments[1]))
          var fmt=PropertyListSerialization.PropertyListFormat.binary
          let obj=try PropertyListSerialization.propertyList(from:data,options:[],format:&fmt)
          let j=try JSONSerialization.data(withJSONObject:clean(obj),options:[])
          FileHandle.standardOutput.write(j)
          SWIFT
          python3 - <<'PY'
          import urllib.request,json,plistlib,tempfile,subprocess,os,difflib
          IDS={
            'new1':'3fba15fcfa304cd29480865558502fa5',
            'new2':'d92cb4884b9f417ba84976a9335bcbec',
            'rotina_prev':'ce76a90d14824325a8cc2f5aa7aad5ef',
            'auto_prev':'d47e109d3eb74bdd970482d2a6cfac39',
          }
          def g(u): return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          def parse(raw):
              try:return plistlib.loads(raw)
              except Exception:
                  fd,path=tempfile.mkstemp(suffix='.shortcut');os.close(fd);open(path,'wb').write(raw)
                  try:return json.loads(subprocess.check_output(['swift','/tmp/plistjson.swift',path],timeout=90))
                  finally:os.unlink(path)
          def load(s):
              m=json.loads(g('https://www.icloud.com/shortcuts/api/records/'+s));f=m['fields'];o=parse(g(f['shortcut']['value']['downloadURL']))
              return f['name']['value'],f.get('signingStatus',{}).get('value'),o
          D={k:load(v) for k,v in IDS.items()}
          DROP={'UUID','GroupingIdentifier','OutputUUID','WFTriggerUUID'}
          def clean(x):
              if isinstance(x,dict):return {k:clean(v) for k,v in x.items() if k not in DROP and 'uuid' not in k.lower()}
              if isinstance(x,list):return [clean(v) for v in x]
              return x
          def js(x):return json.dumps(clean(x),sort_keys=True,ensure_ascii=False,default=str,separators=(',',':'))
          print('=== META ===')
          for k,(n,s,o) in D.items():print(k,n,s,len(o.get('WFWorkflowActions',[])),len(o.get('WFWorkflowTriggers',[])))
          # determine roles
          current={k:v for k,v in D.items() if k in ('new1','new2')}
          for k,(n,s,o) in current.items():
              print('=== CURRENT',k,n,'TOP_KEYS===')
              print(sorted(o.keys()))
              print('STORAGE_TOPLEVEL',[(kk,o[kk]) for kk in o.keys() if 'stor' in kk.lower()])
              print('=== CURRENT',k,n,'STORAGE ACTIONS===')
              for i,a in enumerate(o.get('WFWorkflowActions',[])):
                  ident=a.get('WFWorkflowActionIdentifier','');p=a.get('WFWorkflowActionParameters',{})
                  if 'storedcontent' in ident.lower() or 'descanso_noturno' in js(p) or 'acordar_adiado' in js(p):
                      print(i,ident,js(p))
              print('=== CURRENT',k,n,'SILENT/VOLUME/FOCUS/RUN===')
              for i,a in enumerate(o.get('WFWorkflowActions',[])):
                  ident=a.get('WFWorkflowActionIdentifier','');p=a.get('WFWorkflowActionParameters',{})
                  if ('SilentModeAction' in ident or ident in ('is.workflow.actions.setvolume','is.workflow.actions.dnd.set','is.workflow.actions.runworkflow')):
                      print(i,ident,js(p))
              print('=== CURRENT',k,n,'TRIGGERS===')
              for i,t in enumerate(o.get('WFWorkflowTriggers',[])):print(i,js(t))
          # semantic diffs by matching name
          def diff(label,old,new):
              oa=old.get('WFWorkflowActions',[]);na=new.get('WFWorkflowActions',[])
              sa=[js(a) for a in oa];sb=[js(a) for a in na]
              print('=== DIFF',label,'===')
              sm=difflib.SequenceMatcher(a=sa,b=sb,autojunk=False)
              for tag,i1,i2,j1,j2 in sm.get_opcodes():
                  if tag!='equal':
                      print('OP',tag,'OLD',i1,i2,'NEW',j1,j2)
                      for i in range(i1,i2):print(' OLD',i,oa[i].get('WFWorkflowActionIdentifier'),js(oa[i].get('WFWorkflowActionParameters',{})))
                      for j in range(j1,j2):print(' NEW',j,na[j].get('WFWorkflowActionIdentifier'),js(na[j].get('WFWorkflowActionParameters',{})))
              print('TRIGGERS_SEM_EQUAL',sorted(js(x) for x in old.get('WFWorkflowTriggers',[]))==sorted(js(x) for x in new.get('WFWorkflowTriggers',[])))
          for k,(n,s,o) in current.items():
              if n=='Rotina': diff('ROTINA_vs_ce76',D['rotina_prev'][2],o)
              if n=='Automação Rotina': diff('AUTO_vs_d47e',D['auto_prev'][2],o)
          # Control flow details for automation
          for k,(n,s,o) in current.items():
              if n=='Automação Rotina':
                  print('=== AUTO CONTROL FLOW FULL===')
                  for i,a in enumerate(o.get('WFWorkflowActions',[])):
                      p=a.get('WFWorkflowActionParameters',{});print(i,a.get('WFWorkflowActionIdentifier'),'MODE',p.get('WFControlFlowMode'),'GID',p.get('GroupingIdentifier'),'PARAM',js(p))
              if n=='Rotina':
                  A=o.get('WFWorkflowActions',[])
                  print('=== ROTINA RELEVANT 136-END===')
                  for i in range(136,len(A)):
                      a=A[i];ident=a.get('WFWorkflowActionIdentifier','');p=a.get('WFWorkflowActionParameters',{})
                      if i<165 or i>=188:
                          print(i,ident,'MODE',p.get('WFControlFlowMode'),'GID',p.get('GroupingIdentifier'),'PARAM',js(p))
                  # no Sono, provider check
                  blob=js(o).lower();print('SONO_HITS',blob.count('sono'))
                  print('WATCH_SILENT_HITS',sum(1 for a in A if 'watch' in a.get('WFWorkflowActionIdentifier','').lower() and 'silent' in a.get('WFWorkflowActionIdentifier','').lower()))
          PY
